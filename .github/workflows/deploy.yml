name: Deploy PlaceMux Backend to AWS

on:
  push:
    branches: [ main, testing ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build React Frontend Assets
        run: |
          cd frontend
          npm install
          npm run build

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Services to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Build and push API Gateway
          docker build -t $ECR_REGISTRY/placemux-gateway:latest -f gateway/Dockerfile .
          docker push $ECR_REGISTRY/placemux-gateway:latest

          # Build and push Auth Service
          docker build -t $ECR_REGISTRY/placemux-auth-service:latest -f services/auth/Dockerfile .
          docker push $ECR_REGISTRY/placemux-auth-service:latest

          # Build and push Company Service
          docker build -t $ECR_REGISTRY/placemux-company-service:latest -f services/company/Dockerfile .
          docker push $ECR_REGISTRY/placemux-company-service:latest

          # Build and push Interview Service
          docker build -t $ECR_REGISTRY/placemux-interview-service:latest -f services/interview/Dockerfile .
          docker push $ECR_REGISTRY/placemux-interview-service:latest

          # Build and push Admin Service
          docker build -t $ECR_REGISTRY/placemux-admin-service:latest -f services/admin/Dockerfile .
          docker push $ECR_REGISTRY/placemux-admin-service:latest

          # Build and push React Frontend
          docker build -t $ECR_REGISTRY/placemux-frontend:latest -f frontend/Dockerfile ./frontend
          docker push $ECR_REGISTRY/placemux-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Copy Configs and Compose to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,monitoring/"
          target: "~/placemux"

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/placemux
            cd /home/ubuntu/placemux

            # Ensure docker-compose.prod.yml is present
            if [ -f /home/ubuntu/docker-compose.prod.yml ]; then
              cp /home/ubuntu/docker-compose.prod.yml /home/ubuntu/placemux/
            fi
            if [ -d "/home/ubuntu/~/placemux" ]; then
              cp -r "/home/ubuntu/~/placemux"/* /home/ubuntu/placemux/ 2>/dev/null || true
            fi
            if [ ! -f /home/ubuntu/placemux/docker-compose.prod.yml ]; then
              curl -sSL https://raw.githubusercontent.com/adithyaganesh999/placemux-demo/testing/docker-compose.prod.yml -o /home/ubuntu/placemux/docker-compose.prod.yml
            fi

            echo "${{ secrets.PROD_ENV_FILE }}" > /home/ubuntu/placemux/.env
            echo "ECR_REGISTRY=${{ secrets.AWS_ECR_REGISTRY }}" >> /home/ubuntu/placemux/.env

            export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
            export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            export AWS_DEFAULT_REGION="${{ secrets.AWS_REGION }}"

            # Ensure AWS CLI is installed
            if ! command -v aws &> /dev/null; then
              sudo apt-get update -y && sudo apt-get install -y awscli
            fi

            # Log into ECR for both user and root
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_REGISTRY }} || true
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | sudo docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_REGISTRY }}

            # Pull and start containers with sudo
            sudo -E docker compose -f docker-compose.prod.yml pull
            sudo -E docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Verify running containers
            sudo docker ps -a


